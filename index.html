<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>삐빅,,,명령,,해,,주십,,,오,,, · ara-workbench</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1f2933; --sub:#616e7c;
    --line:#e1e6ea; --brand:#1f6b3b; --brand-weak:#e7f2ec; --logo-bg:#f6d860;
    --term:#16a34a;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --shadow-hover:0 12px 24px rgba(16,24,40,.10),0 4px 8px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(135deg,#fff9e8 0%,#fdf1de 45%,#fbe9d7 100%);color:var(--ink);
    font-family:Consolas,"D2Coding","Nanum Gothic Coding","맑은 고딕","Malgun Gothic",monospace;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  header.top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
  header.top .logo{width:64px;height:64px;border-radius:14px;background:var(--logo-bg);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  header.top .logo img{width:88%;height:88%;object-fit:contain}
  .signal{display:flex;flex-direction:column;gap:3px;margin:0 2px}
  .signal i{display:block;height:3px;border-radius:2px;background:#3fb6ff}
  .signal i:nth-child(1){width:10px}
  .signal i:nth-child(2){width:16px}
  .signal i:nth-child(3){width:22px}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--sub);font-size:13px;margin:4px 0 34px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  a.tool{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);
    transition:transform .14s, box-shadow .14s, border-color .14s}
  a.tool:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#cfe3d6}
  .tool .ico{width:52px;height:52px;border-radius:12px;background:var(--brand-weak);
    display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:14px}
  .tool .ico.lunch{background:#e2453c}
  .tool .ico.expense{background:#f28c28}
  .tool .name{font-size:16px;font-weight:700;margin:0 0 4px}
  .tool .desc{font-size:13px;color:var(--sub);margin:0;line-height:1.55}
  .tool .go{margin-top:14px;font-size:13px;font-weight:700;color:var(--term);display:inline-flex;align-items:center;gap:4px}
  .foot{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
  .foot .bot-rule{display:flex;align-items:center;justify-content:center;gap:10px;color:#c9cfda;
    letter-spacing:2px;margin-bottom:8px}
  .foot .bot-rule img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">
        <img src="assets/robot.png" alt="로봇" />
      </div>
      <div class="signal"><i></i><i></i><i></i></div>
      <div>
        <h1>삐빅,,,명령,,해,,주십,,,오,,,</h1>
      </div>
    </header>
    <p class="sub">_시스템_준비_완료_//_명령을_입력하거나_도구를_실행하세,,,오..</p>

    <div class="grid">

      <a class="tool" href="점심/">
        <div class="ico lunch">🍴</div>
        <p class="name">&gt;_오점뭐.exe</p>
        <p class="desc">오늘 점심 뭐 먹지? 메뉴 골라주기</p>
        <span class="go">[ 실행하기 &gt;&gt; ]</span>
      </a>

      <a class="tool" href="접대비/">
        <div class="ico expense">🧾</div>
        <p class="name">&gt;_접대비_전표.exe</p>
        <p class="desc">접대비 사진 → 위하고 업로드용 엑셀 자동 생성</p>
        <span class="go">[ 실행하기 &gt;&gt; ]</span>
      </a>

      <!-- 새 도구가 생기면 아래 형식으로 카드만 추가하면 됩니다.
      <a class="tool" href="폴더이름/">
        <div class="ico">⭐</div>
        <p class="name">&gt;_도구_이름.exe</p>
        <p class="desc">간단한 설명</p>
        <span class="go">[ 실행하기 &gt;&gt; ]</span>
      </a>
      -->

    </div>

    <p class="foot">
      <span class="bot-rule">..........<img src="assets/robot.png" alt="로봇" />..........</span>
      각_도구는_이_페이지에서_열어_사용하세,,오..
    </p>
  </div>
</body>
</html>
